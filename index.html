<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAGAR GRINDING WORKS - ડ્રોઈંગ મેનેજર</title>
  
  <!-- સત્તાવાર 3D મેટાલિક લોગો -->
  <link rel="icon" type="image/png" href="1e4f928e-8efe-4335-9efd-a31f71419358.png">
  <link rel="apple-touch-icon" href="1e4f928e-8efe-4335-9efd-a31f71419358.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#020617">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .gold-gradient-text {
      background: linear-gradient(135deg, #FDE68A 0%, #F59E0B 50%, #D97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 pb-28">

  <!-- હેડર (SAGAR GRINDING WORKS 3D લોગો) -->
  <header class="bg-gradient-to-r from-slate-950 via-slate-900 to-blue-950 text-white p-3.5 shadow-2xl sticky top-0 z-30 border-b-2 border-cyan-500/40">
    <div class="max-w-md mx-auto flex justify-between items-center">
      
      <div class="flex items-center gap-3">
        <img src="1e4f928e-8efe-4335-9efd-a31f71419358.png" alt="Sagar Grinding Works Logo" class="w-13 h-13 rounded-full border-2 border-cyan-400 shadow-xl object-cover ring-2 ring-cyan-400/30 flex-shrink-0" style="width: 52px; height: 52px;">

        <div>
          <h1 class="text-base font-black tracking-wide leading-tight text-white uppercase drop-shadow">
            SAGAR GRINDING WORKS
          </h1>
          <p class="text-[11px] text-cyan-300 font-semibold flex items-center gap-1">
            <i class="fa-solid fa-gear fa-spin text-[9px] text-amber-400"></i> ડ્રોઈંગ & PDF મેનેજર
          </p>
        </div>
      </div>

      <button onclick="openBackupModal()" class="bg-white/10 hover:bg-white/20 px-2.5 py-1.5 rounded-xl text-xs font-bold border border-cyan-400/40 flex items-center gap-1 transition text-cyan-200">
        <i class="fa-solid fa-cloud-arrow-down text-xs"></i> બેકઅપ
      </button>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">

    <!-- સર્ચ બાર -->
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-400 text-sm"></i>
      <input type="text" id="searchInput" oninput="handleSearch()" placeholder="કંપનીનું નામ અથવા ડ્રોઈંગ નંબર શોધો..." 
        class="w-full bg-white border border-slate-300 rounded-2xl py-3 pl-10 pr-10 text-xs shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent">
      <button onclick="clearSearch()" id="clearSearchBtn" class="hidden absolute right-3.5 top-3.5 text-slate-400 hover:text-slate-600">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>

    <!-- ========================================================= -->
    <!-- ૧. મુખ્ય હોમ સ્ક્રીન: બધી કંપનીઓના ફોલ્ડર (ALL COMPANIES) -->
    <!-- ========================================================= -->
    <div id="homeCompaniesSection" class="space-y-3">
      
      <!-- નવી કંપની ઉમેરવાનું બટન અને હેડિંગ -->
      <div class="flex justify-between items-center">
        <div>
          <h2 class="text-sm font-black text-slate-900 flex items-center gap-1.5">
            <i class="fa-solid fa-folder-closed text-blue-700"></i> કંપની ફોલ્ડર્સ
          </h2>
          <p class="text-[11px] text-slate-500">જે કંપની પર ટચ કરશો તેના જ ડ્રોઈંગ્સ ખુલશે</p>
        </div>
        <button onclick="openAddCompanyModal()" class="bg-blue-700 hover:bg-blue-800 text-white font-bold px-3 py-2 rounded-xl text-xs shadow-sm flex items-center gap-1.5 transition active:scale-95">
          <i class="fa-solid fa-plus text-amber-300"></i>
          <span>નવી કંપની</span>
        </button>
      </div>

      <!-- કંપની ફોલ્ડર કાર્ડ્સ કન્ટેનર -->
      <div class="space-y-2.5" id="companiesFolderContainer">
        <!-- કંપની કાર્ડ્સ અહીં આવશે -->
      </div>
    </div>

    <!-- ========================================================= -->
    <!-- ૨. કંપનીનું પર્સનલ ફોલ્ડર પેજ (COMPANY SPECIFIC VIEW) -->
    <!-- ========================================================= -->
    <div id="singleCompanySection" class="hidden space-y-3">
      
      <!-- બેક બટન અને કંપની હેડર -->
      <div class="bg-gradient-to-r from-blue-900 to-indigo-950 text-white p-4 rounded-2xl shadow-md space-y-2.5">
        <div class="flex justify-between items-center">
          <button onclick="backToAllCompanies()" class="bg-white/15 hover:bg-white/25 text-white text-xs font-bold px-3 py-1.5 rounded-xl border border-white/20 flex items-center gap-1.5 transition">
            <i class="fa-solid fa-arrow-left"></i> બધી કંપનીઓ
          </button>
          <span class="text-[11px] bg-cyan-400/20 text-cyan-200 px-2.5 py-0.5 rounded-full font-bold border border-cyan-300/30" id="currentCompDrawingsCountBadge">
            ૦ ડ્રોઈંગ્સ
          </span>
        </div>

        <div>
          <h2 class="text-lg font-black text-amber-300 flex items-center gap-2" id="currentViewingCompanyName">
            કંપનીનું નામ
          </h2>
          <p class="text-xs text-slate-300 font-medium" id="currentViewingCompanyPhone"></p>
        </div>

        <!-- આ કંપનીમાં સીધું નવું ડ્રોઈંગ ઉમેરવાનું બટન -->
        <button onclick="openAddDrawingForCurrentCompany()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs shadow flex items-center justify-center gap-2 transition active:scale-95">
          <i class="fa-solid fa-file-circle-plus text-sm"></i>
          <span>+ આ કંપનીમાં નવું ડ્રોઈંગ / PDF ઉમેરો</span>
        </button>
      </div>

      <!-- માત્ર આ કંપનીના ડ્રોઈંગ્સ કન્ટેનર -->
      <div class="space-y-3" id="singleCompanyDrawingsContainer">
        <!-- આ કંપનીના ડ્રોઈંગ્સ અહીં આવશે -->
      </div>
    </div>

  </main>

  <!-- ================================================= -->
  <!-- મોડલ ૧: નવી કંપની ઉમેરો (Add Company Modal) -->
  <!-- ================================================= -->
  <div id="addCompanyModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-3xl max-w-md w-full p-5 shadow-2xl border border-slate-200 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="font-black text-slate-900 text-sm flex items-center gap-2">
          <i class="fa-solid fa-building text-blue-700"></i> નવી કંપની ઉમેરો
        </h3>
        <button onclick="closeAddCompanyModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">કંપનીનું પૂરું નામ *</label>
          <input type="text" id="newCompanyNameInput" placeholder="દા.ત. પટેલ એન્જિનિયરિંગ / L&T / ટાટા" class="w-full border border-slate-300 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-600">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">સંપર્ક વ્યક્તિ / ફોન નંબર (Optional)</label>
          <input type="text" id="newCompanyPhoneInput" placeholder="દા.ત. રમેશભાઈ - 9876543210" class="w-full border border-slate-300 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-600">
        </div>
      </div>
      <div class="pt-2 flex gap-2 text-xs">
        <button onclick="saveCompany()" class="flex-1 bg-blue-700 hover:bg-blue-800 text-white font-bold py-2.5 rounded-xl shadow">કંપની સેવ કરો</button>
        <button onclick="closeAddCompanyModal()" class="px-4 bg-slate-200 text-slate-700 font-bold py-2.5 rounded-xl">રદ કરો</button>
      </div>
    </div>
  </div>

  <!-- ================================================= -->
  <!-- મોડલ ૨: નવું ડ્રોઈંગ ઉમેરો (Add Drawing Modal) -->
  <!-- ================================================= -->
  <div id="addDrawingModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-3xl max-w-md w-full max-h-[90vh] overflow-y-auto p-5 shadow-2xl border border-slate-200 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="font-black text-slate-900 text-sm flex items-center gap-2">
          <i class="fa-solid fa-file-circle-plus text-emerald-600"></i> નવું ડ્રોઈંગ / PDF સેવ કરો
        </h3>
        <button onclick="closeAddDrawingModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="block font-bold text-slate-700 mb-1">૧. કંપની</label>
          <input type="text" id="displayCompanyInput" readonly class="w-full bg-slate-100 border border-slate-300 rounded-xl p-2.5 font-bold text-blue-800">
          <input type="hidden" id="selectCompanyInput">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">૨. ડ્રોઈંગ નંબર અથવા પાર્ટનું નામ *</label>
          <input type="text" id="inputTitle" placeholder="દા.ત. DRG-104 / Shaft 50mm" class="w-full border border-slate-300 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-600">
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">૩. વધારાની નોંધ / વિગત (Optional)</label>
          <textarea id="inputNotes" rows="2" placeholder="મટીરીયલ, સાઇઝ કે અન્ય સૂચના..." class="w-full border border-slate-300 rounded-xl p-2.5 focus:outline-none focus:ring-2 focus:ring-blue-600"></textarea>
        </div>
        <div>
          <label class="block font-bold text-slate-700 mb-1">૪. ડ્રોઈંગનો ફોટો અથવા PDF ફાઈલ પસંદ કરો *</label>
          <div class="border-2 border-dashed border-emerald-300 rounded-2xl p-4 text-center bg-emerald-50/50 hover:bg-emerald-50 transition cursor-pointer relative">
            <input type="file" id="inputFile" accept="image/*,application/pdf" onchange="handleFileSelect(event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
            <div id="fileUploadPrompt">
              <i class="fa-solid fa-cloud-arrow-up text-3xl text-emerald-500 mb-1.5"></i>
              <p class="font-bold text-slate-700 text-xs">ફોટો પાડો અથવા ફાઈલ પસંદ કરો</p>
              <p class="text-[10px] text-slate-500">JPG, PNG અથવા PDF ફાઈલ</p>
            </div>
            <div id="fileSelectedPreview" class="hidden text-left bg-white p-2.5 rounded-xl border border-emerald-200 flex items-center gap-2">
              <span id="previewIcon" class="w-8 h-8 rounded-lg bg-emerald-100 text-emerald-600 flex items-center justify-center font-bold"></span>
              <div class="overflow-hidden">
                <p id="previewFileName" class="font-bold text-slate-800 truncate text-[11px]"></p>
